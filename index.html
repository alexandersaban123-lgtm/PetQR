<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetQR</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            margin: 0;
            text-align: center;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        .contenedor {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #ccc;
        }

        .perrito {
            font-size: 80px;
        }

        h2 {
            color: #333;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>

    <header>
        <h1>🐾 PetQR</h1>
        <p style="color:white;">Identifica a tu mascota y ayúdala a volver a casa.</p>
    </header>

    <div class="contenedor">

        <div class="perrito">🐶</div>

        <h2>La seguridad de tu mascota comienza aquí</h2>

        <p>
            Crea un perfil para tu mascota y obtén un código QR
            para colocar en su collar.
        </p>

        <button onclick="window.location.href='registro.html'">
    Registrar mi mascota
</button>

    </div>

</body>
</html>
