<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar mascota - Mi Huella</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7f5;
        margin: 0;
    }
    header {
        background: #2e7d32;
        color: white;
        padding: 20px;
        text-align: center;
    }
    .contenedor {
        max-width: 500px;
        margin: 30px auto;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 3px 10px #ccc;
    }
    h2 {
        text-align: center;
        color: #333;
    }
    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }
    input, textarea, select {
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }
    textarea {
        height: 90px;
        resize: none;
    }
    button {
        width: 100%;
        margin-top: 25px;
        padding: 15px;
        background: #2e7d32;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
    }
    button:hover {
        background: #1b5e20;
    }
    .volver {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #2e7d32;
        text-decoration: none;
    }
</style>
</head>
<body>
<header>
    <h1>🐾 Mi Huella</h1>
</header>
<div class="contenedor">
<h2>Registrar mi mascota 🐶</h2>
<form onsubmit="registrarMascota(event)">
    <label>Nombre de la mascota</label>
    <input type="text" id="nombre" placeholder="Ejemplo: Max" required>
    <label>Raza</label>
    <input type="text" id="raza" placeholder="Ejemplo: Labrador">
    <label>Edad</label>
    <input type="number" id="edad" placeholder="Ejemplo: 3">
    <label>Sexo</label>
    <select id="sexo">
        <option value="">Seleccionar</option>
        <option value="Macho">Macho</option>
        <option value="Hembra">Hembra</option>
    </select>
    <label>Características</label>
    <textarea id="caracteristicas"
    placeholder="Ejemplo: Tiene una mancha blanca en el pecho"></textarea>
    <label>Nombre del dueño</label>
    <input type="text" id="dueno" placeholder="Tu nombre" required>
    <label>Teléfono de contacto</label>
    <input type="tel" id="telefono" placeholder="Ejemplo: 5555-5555" required>
    <button type="submit">
        🐾 Guardar mascota
    </button>
</form>
<a class="volver" href="index.html">
    ← Volver al inicio
</a>
</div>
<script>
// ==================================================
// 1. CONEXIÓN CON SUPABASE
// ==================================================
// AQUÍ VAS A PEGAR TU API URL
const SUPABASE_URL = "https://puqorwmmtdyifpxnylef.supabase.co/rest/v1/";
// AQUÍ VAS A PEGAR TU PUBLISHABLE KEY
const SUPABASE_KEY = "sb_publishable_eaRIUdCpMVRhOn6wLESmDQ_mVdRR6TW";
// ==================================================
// 2. REGISTRAR MASCOTA
// ==================================================
async function registrarMascota(event) {
    event.preventDefault();
    const mascota = {
        nombre: document.getElementById("nombre").value,
        raza: document.getElementById("raza").value,
        edad: document.getElementById("edad").value
            ? parseInt(document.getElementById("edad").value)
            : null,
        sexo: document.getElementById("sexo").value,
        caracteristicas:
            document.getElementById("caracteristicas").value,
        dueno:
            document.getElementById("dueno").value,
        telefono:
            document.getElementById("telefono").value,
        qr_id: crypto.randomUUID()
    };
    try {
        const respuesta = await fetch(
            SUPABASE_URL + "/rest/v1/mascotas",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY,
                    "Prefer":
                        "return=representation"
                },
                body: JSON.stringify(mascota)
            }
        );
        if (!respuesta.ok) {
            const error =
                await respuesta.text();
            console.error(error);
            alert(
                "❌ No se pudo registrar la mascota."
            );
            return;
        }
        const datos =
            await respuesta.json();
        localStorage.setItem(
            "qr_id",
            datos[0].qr_id
        );
        alert(
            "🐾 ¡Mascota registrada correctamente!"
        );
        window.location.href =
            "perfil.html?id=" +
            datos[0].qr_id;
    }
    catch (error) {
        console.error(error);
        alert(
            "❌ No se pudo conectar con Supabase."
        );
    }
}
</script>
</body>
</html>
